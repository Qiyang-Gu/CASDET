# =====================================================================
# CASDET main experiments (paper Section 4.1 settings; Table 2)
#
# Models : Llama2-7B / Llama2-13B / Llama3-8B / Mistral-7B
# Data   : RAGTruth (with the Llama3-8B extension) and HalluRAG
# Metrics: AUROC / AUPRC / PCC
#
# The response-level score is defined on an evaluation batch (paper Eq. 16):
# the three statistics are converted to relative positions within the batch
# and combined with equal weights (1/3 each). No threshold or head/layer
# selection is involved.
# =====================================================================

seed: 42
max_len: 4096         # Truncate the beginning of over-long contexts; keep query+answer.
max_samples: null     # Set to a small integer for debugging.

# Evaluation protocol (paper Section 4.1). When a dataset has no official
# train/val split (or uses cv_folds), the evaluation split is formed by the
# loader; see CASDET/datasets.py.
val_ratio: 0.2

output_dir: log/results/main

# Cache per-response layer effects for the fixed-reference check (Table 3).
# The files are NaN-padded and ignored by git; set to false if not needed.
save_layer_effects: true

# Weight-grid resolution for the weight-simplex analysis (Figure 5).
# Must be divisible by 3 so that the equal-weight point (1/3, 1/3, 1/3)
# is on the grid. 12 gives 91 weight points, matching the paper.
weight_grid_step: 12

models:
  llama2_7b:
    name: models/Llama-2-7b-chat-hf
    dtype: float16
  llama2_13b:
    name: models/Llama-2-13b-chat-hf
    dtype: float16
    device: auto_multi   # 13B fp16 does not fit on one 24GB GPU.
  llama3_8b:
    name: models/Llama-3-8B-Instruct
    dtype: float16
  mistral_7b:
    name: models/Mistral-7B-Instruct-v0.1   # Responses in both datasets were generated by v0.1.
    dtype: float16

datasets:
  # RAGTruth (Niu et al., 2024) with the Llama3-8B extension.
  # After src/prepare_ragtruth.py, each model reads its own response.jsonl.
  # quality: good drops incorrect_refusal and truncated responses, which
  # contain no unsupported content and would turn the task into refusal
  # detection. The same rule is applied to every evaluated method.
  - name: ragtruth
    split: null      # null = use the split recorded in each sample.
    quality: good
    files:
      llama2_7b:  dataset/ragtruth/llama2_7b/response.jsonl
      llama2_13b: dataset/ragtruth/llama2_13b/response.jsonl
      llama3_8b:  dataset/ragtruth/llama3_8b/response.jsonl
      mistral_7b: dataset/ragtruth/mistral_7b/response.jsonl

  # HalluRAG (Ridder & Schilling, 2025), answerable instances only.
  # The official test split is small after filtering, so we use 5-fold
  # cross-validation over all answerable samples. Llama3-8B is not reported
  # because HalluRAG does not provide responses for it.
  - name: hallurag
    cv_folds: 5
    models: [llama2_7b, llama2_13b, mistral_7b]
    files:
      llama2_7b:  dataset/hallurag/llama2_7b.json
      llama2_13b: dataset/hallurag/llama2_13b.json
      mistral_7b: dataset/hallurag/mistral_7b.json
